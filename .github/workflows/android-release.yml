name: Android Release

on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
      TARGET: vanilla
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-android-vanilla-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-android-vanilla-

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install ccache apksigner -y

      - name: Update Android SDK CMake version
        run: |
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "cmake;3.30.3"

      - name: Build and sign Android APK
        run: JAVA_HOME=$JAVA_HOME_17_X64 ./.ci/android.sh
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}

      - name: Verify signature and stage APK
        run: |
          APK_PATH=$(find src/android/app/build/outputs/apk/vanilla/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No release APK found"
            exit 1
          fi
          apksigner verify --print-certs "$APK_PATH"
          cp "$APK_PATH" azahar-android-latest.apk

      - name: Publish to rolling 'latest' release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest azahar-android-latest.apk --clobber
            gh release edit latest --notes "Latest signed Android (vanilla) build from commit \`${{ github.sha }}\`."
          else
            gh release create latest azahar-android-latest.apk \
              --title "Latest Android Build" \
              --notes "Latest signed Android (vanilla) build from commit \`${{ github.sha }}\`." \
              --target "${{ github.sha }}"
          fi
